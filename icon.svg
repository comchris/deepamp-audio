  <rect x="1.5" y="1.5" width="33" height="33" rx="8" stroke="#4A5260" stroke-width="1.5"/>
  <path d="M6 18 H30" stroke="#5C6675" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="7" y="14.5" width="2.6" height="7" rx="1.3" fill="#C99A5B"/>
  <rect x="11.6" y="10.5" width="2.6" height="15" rx="1.3" fill="#C99A5B"/>
