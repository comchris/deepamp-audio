<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    DEEPAMP bundle icon (T-910). Original artwork, drawn for this package: one audio lane
    carrying a take of uneven bars, which is what the plugin is - a queue that places a
    render on an engine and hands the take back. Flat fills only, no glow, no lettering,
    so it reads at row size in both themes.
  -->
